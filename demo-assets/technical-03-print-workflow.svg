<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#1a3a5c"/></marker></defs><rect width="1920" height="1080" fill="white"/><text x="65" y="53" font-family="Arial,sans-serif" font-size="22" fill="#d66328" font-weight="700">REGISTRATION NATION / TECHNICAL WORKFLOW</text><text x="65" y="115" font-family="Arial,sans-serif" font-size="47" fill="#1a3a5c" font-weight="700">Review, print submission and completion</text><text x="65" y="159" font-family="Arial,sans-serif" font-size="27" fill="#536a80" font-weight="400">Runs only after the Payment diagram’s charge succeeds. No registration database is connected.</text><rect x="60" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M245 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="82" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">React / Chromium</text><rect x="535" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M720 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="557" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">Flask API :5000</text><rect x="1010" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M1195 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="1032" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">Print service</text><rect x="1485" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M1670 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="1507" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">CUPS / printer</text><rect x="65" y="284" width="365" height="126" rx="9" fill="#f1f5f9" stroke="#c4d2df" stroke-width="2"/><text x="83" y="318" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">Card already charged (see</text><text x="83" y="352" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">Payment diagram) — generate</text><text x="83" y="386" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">REG- confirmation</text><path d="M245 466H720" fill="none" stroke="#1a3a5c" stroke-width="3"  marker-end="url(#arr)"/><text x="260" y="449" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">1  POST print payload</text><text x="265" y="503" font-family="Arial,sans-serif" font-size="24" fill="#1a3a5c" font-weight="400">/api/print/registration</text><rect x="530" y="515" width="380" height="126" rx="9" fill="#f1f5f9" stroke="#c4d2df" stroke-width="2"/><text x="548" y="549" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">2  Validate required values</text><text x="548" y="583" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">registrant, license_plate,</text><text x="548" y="617" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">confirmation_number</text><path d="M720 684H1195" fill="none" stroke="#1a3a5c" stroke-width="3"  marker-end="url(#arr)"/><text x="735" y="667" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">3  print_registration_mockup</text><rect x="990" y="706" width="410" height="92" rx="9" fill="#f1f5f9" stroke="#c4d2df" stroke-width="2"/><text x="1008" y="740" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">Build mockup; write temp text</text><text x="1008" y="774" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">No card data in print payload</text><path d="M1195 839H1670" fill="none" stroke="#1a3a5c" stroke-width="3"  marker-end="url(#arr)"/><text x="1210" y="822" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">4  Run lp (20s timeout)</text><path d="M1670 905H1195" fill="none" stroke="#1a3a5c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr)"/><text x="1210" y="888" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">5  Job accepted</text><path d="M1195 959H720" fill="none" stroke="#1a3a5c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr)"/><text x="735" y="942" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">6  Job output; remove temp file</text><path d="M720 959H245" fill="none" stroke="#1a3a5c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr)"/><text x="260" y="942" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">7  JSON → submitted = true</text><text x="65" y="1010" font-family="Arial,sans-serif" font-size="26" fill="#b45309" font-weight="400">Failure: 400 missing fields / 503 printer error. UI stays at Payment; retry reprints only — the card is not charged again.</text><text x="65" y="1053" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">Success shows the confirmation screen and fires POST /api/monday/create_record in the background (non-blocking, optional).</text></svg>