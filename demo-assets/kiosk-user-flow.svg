<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#1a3a5c"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="80" y="72" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#d66328">REGISTRATION NATION</text><text x="80" y="139" font-family="Arial, sans-serif" font-size="53" font-weight="700" fill="#1a3a5c">Vehicle registration kiosk user flow</text><text x="80" y="191" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#536a80">Staff signs in once, then each customer follows the five-step journey.</text><rect x="80" y="265" width="520" height="222" rx="14" fill="#f3f6fa" stroke="#c9d5e1" stroke-width="2"/><circle cx="123" cy="308" r="24" fill="#1a3a5c"/><text x="115" y="318" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">1</text><text x="162" y="318" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1a3a5c">Personal information</text><text x="110" y="370" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Scan license or upload an image</text><text x="110" y="409" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Review name, birth date and address</text><text x="110" y="448" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Enter email and phone</text><rect x="700" y="265" width="520" height="222" rx="14" fill="#f3f6fa" stroke="#c9d5e1" stroke-width="2"/><circle cx="743" cy="308" r="24" fill="#1a3a5c"/><text x="735" y="318" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">2</text><text x="782" y="318" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1a3a5c">Driver’s license</text><text x="730" y="370" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Confirm the prefilled license details</text><text x="730" y="409" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Check number, state, expiry and class</text><text x="730" y="448" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Correct any missing or misread data</text><rect x="1320" y="265" width="520" height="222" rx="14" fill="#f3f6fa" stroke="#c9d5e1" stroke-width="2"/><circle cx="1363" cy="308" r="24" fill="#1a3a5c"/><text x="1355" y="318" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">3</text><text x="1402" y="318" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1a3a5c">Insurance &amp; vehicle</text><text x="1350" y="370" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Scan insurance or upload an image</text><text x="1350" y="409" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Review vehicle details and expiry</text><text x="1350" y="448" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Enter remaining policy data and plate</text><rect x="1320" y="587" width="520" height="222" rx="14" fill="#f3f6fa" stroke="#c9d5e1" stroke-width="2"/><circle cx="1363" cy="630" r="24" fill="#1a3a5c"/><text x="1355" y="640" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">4</text><text x="1402" y="640" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1a3a5c">Review &amp; confirm</text><text x="1350" y="692" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Check all information together</text><text x="1350" y="731" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Use Edit to correct individual fields</text><text x="1350" y="770" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Select Proceed to Payment</text><rect x="700" y="587" width="520" height="222" rx="14" fill="#f3f6fa" stroke="#c9d5e1" stroke-width="2"/><circle cx="743" cy="630" r="24" fill="#1a3a5c"/><text x="735" y="640" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">5</text><text x="782" y="640" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#1a3a5c">Payment</text><text x="730" y="692" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Review the displayed $71.00 total</text><text x="730" y="731" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Tap, insert, or swipe card on reader</text><text x="730" y="770" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Select Pay $71.00 &amp; Print</text><rect x="80" y="587" width="520" height="222" rx="14" fill="#eef7ef" stroke="#8db99a" stroke-width="2"/><circle cx="123" cy="630" r="24" fill="#307044"/><text x="115" y="640" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">✓</text><text x="162" y="640" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#307044">Confirmation &amp; output</text><text x="110" y="692" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Print service accepts the demo job</text><text x="110" y="731" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">View the confirmation number</text><text x="110" y="770" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#40566d">Collect the demo sticker / receipt</text><path d="M600 376H683" fill="none" stroke="#1a3a5c" stroke-width="4"  marker-end="url(#a)"/><path d="M1220 376H1303" fill="none" stroke="#1a3a5c" stroke-width="4"  marker-end="url(#a)"/><path d="M1580 487V570" fill="none" stroke="#1a3a5c" stroke-width="4"  marker-end="url(#a)"/><path d="M1320 698H1237" fill="none" stroke="#1a3a5c" stroke-width="4"  marker-end="url(#a)"/><path d="M700 698H617" fill="none" stroke="#1a3a5c" stroke-width="4"  marker-end="url(#a)"/><path d="M80 698H38V376H63" fill="none" stroke="#1a3a5c" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="81" y="555" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#536a80">Start Next Customer clears the form and returns to step 1</text><line x1="80" y1="858" x2="1840" y2="858" stroke="#c9d5e1" stroke-width="2"/><text x="80" y="905" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#d66328">SCAN RECOVERY</text><text x="80" y="948" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#1a3a5c">Try Again opens image upload.</text><text x="80" y="987" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#1a3a5c">Review and edit extracted values.</text><text x="725" y="905" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#d66328">PRINT RECOVERY</text><text x="725" y="948" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#1a3a5c">An error keeps the user at payment.</text><text x="725" y="987" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#1a3a5c">Retry reprints only — card isn't charged again.</text><text x="1360" y="905" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#d66328">DEMO SCOPE</text><text x="1360" y="948" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#1a3a5c">Real Stripe charge (test mode).</text><text x="1360" y="987" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#1a3a5c">Printed output is a registration mockup.</text></svg>