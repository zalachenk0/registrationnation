<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#1a3a5c"/></marker></defs><rect width="1920" height="1080" fill="white"/><text x="65" y="53" font-family="Arial,sans-serif" font-size="22" fill="#d66328" font-weight="700">REGISTRATION NATION / TECHNICAL WORKFLOW</text><text x="65" y="115" font-family="Arial,sans-serif" font-size="47" fill="#1a3a5c" font-weight="700">Payment (Stripe Terminal)</text><text x="65" y="159" font-family="Arial,sans-serif" font-size="27" fill="#536a80" font-weight="400">A real charge, run in Stripe test mode, must succeed before anything is printed.</text><rect x="60" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M245 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="82" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">React / Chromium</text><rect x="535" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M720 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="557" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">Flask API :5000</text><rect x="1010" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M1195 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="1032" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">Stripe Terminal SDK</text><rect x="1485" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M1670 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="1507" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">Card reader</text><rect x="65" y="284" width="365" height="111" rx="9" fill="#f1f5f9" stroke="#c4d2df" stroke-width="2"/><text x="83" y="318" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">Payment step mounts</text><text x="83" y="352" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">connectToReader() runs automatically</text><path d="M245 460H720" fill="none" stroke="#1a3a5c" stroke-width="3"  marker-end="url(#arr)"/><text x="260" y="443" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">1  POST connection_token → connection token</text><text x="265" y="497" font-family="Arial,sans-serif" font-size="24" fill="#536a80" font-weight="400">stripe.terminal.ConnectionToken.create()</text><path d="M245 600H1195" fill="none" stroke="#1a3a5c" stroke-width="3"  marker-end="url(#arr)"/><text x="260" y="583" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">2  discoverReaders(); connectReader() → reader connected</text><text x="65" y="655" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="700">UI: connecting → ready</text><path d="M245 740H720" fill="none" stroke="#1a3a5c" stroke-width="3"  marker-end="url(#arr)"/><text x="260" y="723" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">3  POST create_intent { amount: 7100 } → client_secret</text><text x="265" y="777" font-family="Arial,sans-serif" font-size="24" fill="#536a80" font-weight="400">customer selects Pay $71.00 &amp; Print</text><rect x="990" y="800" width="410" height="92" rx="9" fill="#f1f5f9" stroke="#c4d2df" stroke-width="2"/><text x="1008" y="834" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">stripe.PaymentIntent.create(</text><text x="1008" y="868" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">  capture_method: 'manual')</text><path d="M245 920H1670" fill="none" stroke="#1a3a5c" stroke-width="3"  marker-end="url(#arr)"/><text x="260" y="903" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">4  collectPaymentMethod(); processPayment() → card confirmed</text><text x="265" y="957" font-family="Arial,sans-serif" font-size="24" fill="#536a80" font-weight="400">simulated reader accepts test card 4242 4242 4242 4242</text><text x="65" y="1010" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="700">5  POST capture_intent → { status: 'succeeded' } — continues to the print workflow (technical-03).</text><text x="65" y="1053" font-family="Arial,sans-serif" font-size="25" fill="#536a80" font-weight="400">Any step returning { success:false } stops here — nothing is printed, and the payment screen shows the error message.</text></svg>