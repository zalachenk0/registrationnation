<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#1a3a5c"/></marker></defs><rect width="1920" height="1080" fill="white"/><text x="65" y="53" font-family="Arial,sans-serif" font-size="22" fill="#d66328" font-weight="700">REGISTRATION NATION / TECHNICAL WORKFLOW</text><text x="65" y="115" font-family="Arial,sans-serif" font-size="47" fill="#1a3a5c" font-weight="700">Document capture and extraction</text><text x="65" y="159" font-family="Arial,sans-serif" font-size="27" fill="#536a80" font-weight="400">One synchronous HTTP request captures or receives the image, extracts fields, and returns JSON.</text><rect x="60" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M245 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="82" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">React / Chromium</text><rect x="535" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M720 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="557" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">Flask API :5000</text><rect x="1010" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M1195 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="1032" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">Camera adapter</text><rect x="1485" y="192" width="370" height="74" rx="8" fill="#1a3a5c"/><path d="M1670 266V930" stroke="#c4d2df" stroke-width="2" stroke-dasharray="8 8"/><text x="1507" y="238" font-family="Arial,sans-serif" font-size="28" fill="white" font-weight="700">Document processors</text><path d="M245 322H720" fill="none" stroke="#1a3a5c" stroke-width="3"  marker-end="url(#arr)"/><text x="260" y="305" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">1  POST camera scan</text><text x="270" y="359" font-family="Arial,sans-serif" font-size="24" fill="#1a3a5c" font-weight="400">/api/camera/scan/{kind}</text><text x="75" y="406" font-family="Arial,sans-serif" font-size="24" fill="#536a80" font-weight="400">kind = license | insurance</text><path d="M720 412H1195" fill="none" stroke="#1a3a5c" stroke-width="3"  marker-end="url(#arr)"/><text x="735" y="395" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">2  capture(temp JPEG)</text><rect x="1005" y="446" width="385" height="111" rx="9" fill="#f1f5f9" stroke="#c4d2df" stroke-width="2"/><text x="1023" y="480" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">Serialize with camera lock</text><text x="1023" y="514" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">rpicam / libcamera / OpenCV</text><path d="M1195 593H720" fill="none" stroke="#1a3a5c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr)"/><text x="735" y="576" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">3  Image saved at temp path</text><path d="M720 651H1670" fill="none" stroke="#1a3a5c" stroke-width="3"  marker-end="url(#arr)"/><text x="735" y="634" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">4  process_license(path) OR process_insurance(path)</text><rect x="1430" y="686" width="445" height="165" rx="9" fill="#f1f5f9" stroke="#c4d2df" stroke-width="2"/><text x="1448" y="720" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">License: crop / preprocess</text><text x="1448" y="754" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">PDF417 decode → AAMVA parse</text><text x="1448" y="788" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">Insurance: OpenCV → Tesseract</text><text x="1448" y="822" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">Choose extraction with most fields</text><rect x="65" y="457" width="365" height="126" rx="9" fill="#f1f5f9" stroke="#c4d2df" stroke-width="2"/><text x="83" y="491" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">Upload alternative:</text><text x="83" y="525" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">POST /api/scan/{kind}</text><text x="83" y="559" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="400">multipart field: image</text><path d="M1670 897H720" fill="none" stroke="#1a3a5c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr)"/><text x="735" y="880" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">5  Normalize dates; add full VIN for insurance</text><path d="M720 967H245" fill="none" stroke="#1a3a5c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arr)"/><text x="260" y="950" font-family="Arial,sans-serif" font-size="26" fill="#1a3a5c" font-weight="400">6  JSON → React state</text><text x="790" y="947" font-family="Arial,sans-serif" font-size="25" fill="#536a80" font-weight="400">{ success, recommendation, fields }</text><text x="65" y="1026" font-family="Arial,sans-serif" font-size="25" fill="#1a3a5c" font-weight="700">UI: idle → scanning → done / error</text><text x="790" y="1026" font-family="Arial,sans-serif" font-size="25" fill="#536a80" font-weight="400">API deletes the temporary image in finally after processing.</text></svg>